<head>

<title>Morning Pasture — an SVG field study</title>
<style>
:root{--paper:#f8f5e9;--accent:#e2712f;--ink:#16351f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0c1c13}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;left:30px;top:26px;pointer-events:none;color:var(--paper);text-shadow:0 3px 16px rgba(7,40,20,.55);z-index:5}
.kick{margin:0;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.34em;text-transform:uppercase;opacity:.8}
#hud h1{margin:9px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(30px,4.4vw,54px);line-height:.9;letter-spacing:-.015em}
#hud h1 em{display:block;font-style:italic;font-weight:700}
.rule{width:66px;height:4px;margin:16px 0 12px;background:var(--accent);border-radius:2px}
.sub{margin:0;max-width:30ch;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.05em;opacity:.9}
footer{position:fixed;right:26px;bottom:22px;display:flex;gap:24px;color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-shadow:0 2px 10px rgba(7,40,20,.6);z-index:5}
footer div{text-align:right}
footer i{display:block;font-style:normal;font-size:9px;letter-spacing:.24em;opacity:.7}
footer b{font-size:15px;font-weight:600;letter-spacing:.04em}
.hint{position:fixed;left:30px;bottom:24px;margin:0;color:var(--paper);opacity:.72;pointer-events:none;font:10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;animation:fade 3.4s ease-in-out infinite;z-index:5}
.hit{fill:#fff;fill-opacity:0;cursor:pointer}
.animal{cursor:pointer;animation:bounce var(--bd,.8s) cubic-bezier(.36,.05,.5,.98) var(--dl,0s) infinite}
.animal.spook{animation:spook .5s cubic-bezier(.3,.75,.4,1) 2}
.leg{transform-box:fill-box;transform-origin:50% 6px;animation:kick var(--ld,.9s) ease-in-out var(--dl,0s) infinite}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:squash var(--bd,.8s) ease-in-out var(--dl,0s) infinite}
.tag{opacity:0;transition:opacity .35s ease}
.animal:hover .tag,.animal.spook .tag{opacity:1}
.tin{transform:translateY(7px);transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
.animal:hover .tin,.animal.spook .tin{transform:translateY(0)}
.tt{font-family:Georgia,serif;font-size:19px;font-weight:700;fill:var(--ink);letter-spacing:.02em}
.tm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#5f7c66;letter-spacing:.05em}
.cl{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
.bb{animation-name:bob;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.crown{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--sd,7s) ease-in-out var(--sdl,0s) infinite}
#rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 150s linear infinite}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 6s ease-in-out infinite}
.beam{animation:beam 9s ease-in-out infinite}
.tuft{transform-box:fill-box;transform-origin:50% 100%;animation:tsway 3s ease-in-out infinite}
.bird{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
.flap{transform-box:fill-box;transform-origin:50% 100%;animation:flap .42s linear infinite}
.wing{transform-box:fill-box;animation:flapp .14s linear infinite}
.puff{transform-box:fill-box;animation:pf .72s ease-out forwards}
@keyframes bounce{0%,100%{transform:translateY(0)}18%{transform:translateY(-11px)}34%{transform:translateY(-16px)}58%{transform:translateY(-5px)}76%{transform:translateY(0)}}
@keyframes spook{0%,100%{transform:translateY(0)}20%{transform:translateY(-42px)}40%{transform:translateY(0)}60%{transform:translateY(-17px)}80%{transform:translateY(0)}}
@keyframes squash{0%,100%{transform:scale(1,1);opacity:.34}34%{transform:scale(.85,.7);opacity:.17}}
@keyframes kick{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4.5deg)}}
@keyframes drift{from{transform:translateX(-430px)}to{transform:translateX(2030px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
@keyframes flapp{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@keyframes tsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.42}50%{transform:scale(1.11);opacity:.72}}
@keyframes beam{0%,100%{opacity:.14}50%{opacity:.3}}
@keyframes pf{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx,12px),var(--dy,-20px)) scale(1.6)}}
@keyframes fade{0%,100%{opacity:.35}50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<g id="pxNear">
  <path d="M0,800c260,-20 520,12 760,6 240,-6 500,18 840,-4L1600,900 0,900Z" fill="url(#gNear)" opacity=".85"/>
  <g id="tufts"></g>
  <g id="flowers"></g>
  <g id="bugs"></g>
</g>
<rect width="1600" height="900" fill="url(#gVig)" pointer-events="none"/>
</svg>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var $=function(id){return document.getElementById(id);};
function rnd(a,b){return a+Math.random()*(b-a);}

/* grass tufts */
var t="";
for(var i=0;i<30;i++){
  var x=rnd(0,1600)|0,y=(598+Math.pow(Math.random(),.6)*286)|0,
      d=rnd(0,4).toFixed(2),u=rnd(2.4,4.6).toFixed(2),s=rnd(.55,1.25).toFixed(2),
      c=Math.random()<.5?"#2f7a34":"#bfe89a";
  t+='<g transform="translate('+x+','+y+') scale('+s+')"><path class="tuft" style="animation-delay:-'+d+'s;animation-duration:'+u+'s" d="M0,0c-3-8-4-14-1-19M0,0c1-9 3-13 6-17" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round" opacity=".8"/></g>';
}
$("tufts").innerHTML=t;

/* wildflowers */
var f="",cols=["#fff6b8","#ffe3ef","#ffffff","#ffd27a"];
for(i=0;i<34;i++){
  f+='<circle cx="'+(rnd(0,1600)|0)+'" cy="'+((612+Math.pow(Math.random(),.7)*270)|0)+'" r="'+rnd(1.8,4).toFixed(1)+'" fill="'+cols[i%4]+'" opacity=".8"/>';
}
$("flowers").innerHTML=f;

/* butterflies */
var bugs=$("bugs"),B=[];
for(i=0;i<2;i++){
  var g=document.createElementNS(NS,"g");
  g.innerHTML='<ellipse class="wing" cx="-8" cy="0" rx="9" ry="6.5" fill="#fff4c9" stroke="#e0c56f" stroke-width=".8"/><ellipse class="wing" cx="8" cy="0" rx="9" ry="6.5" fill="#fff4c9" stroke="#e0c56f" stroke-width=".8"/><ellipse rx="2.4" ry="6.5" cy="1" fill="#4c3a25"/>';
  var d={el:g,ph:rnd(0,6.28),ox:rnd(300,1300),oy:rnd(700,820),sp:rnd(.28,.42)};
  g.children[0].style.transformOrigin="100% 50%";
  g.children[1].style.transformOrigin="0 50%";
  g.style.transformBox="fill-box";
  bugs.appendChild(g);B.push(d);
}

/* parallax */
var P=[[$("pxSky"),7],[$("pxFar"),15],[$("pxNear"),-13]];
addEventListener("pointermove",function(e){
  var nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;
  for(var k=0;k<P.length;k++){
    P[k][0].setAttribute("transform","translate("+(nx*P[k][1]).toFixed(2)+","+(ny*P[k][1]*.45).toFixed(2)+")");
  }
},{passive:true});

/* dust puffs */
var puffs=$("puffs");
function puff(x,y){
  for(var k=0;k<6;k++){
    var c=document.createElementNS(NS,"circle"),a=-Math.PI*Math.random();
    c.setAttribute("cx",x);c.setAttribute("cy",y-4);
    c.setAttribute("r",rnd(3,8).toFixed(1));
    c.setAttribute("fill","#efe0b6");
    c.setAttribute("class","puff");
    c.style.setProperty("--dx",(Math.cos(a)*36).toFixed(1)+"px");
    c.style.setProperty("--dy",(-Math.abs(Math.sin(a))*28-8).toFixed(1)+"px");
    puffs.appendChild(c);
    setTimeout(function(n){return function(){n.remove();};}(c),740);
  }
}

/* startle on click */
var A=document.querySelectorAll(".animal");
for(i=0;i<A.length;i++){
  (function(el){
    el.addEventListener("click",function(){
      el.classList.remove("spook");
      void el.getBoundingClientRect();
      el.classList.add("spook");
      clearTimeout(el._t);
      el._t=setTimeout(function(){el.classList.remove("spook");},1040);
      puff(+el.getAttribute("data-x"),+el.getAttribute("data-y"));
    });
  })(A[i]);
}

/* clock + loop */
var clk=$("clk"),m=7*60+42;
setInterval(function(){
  m++;
  clk.textContent=(("0"+((m/60|0)%24)).slice(-2))+":"+ (("0"+(m%60)).slice(-2));
},1000);
var wind=$("wind"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(ts){
  var t=ts/1000;
  for(var k=0;k<B.length;k++){
    var b=B[k],x=b.ox+Math.sin(t*b.sp+b.ph)*300,y=b.oy+Math.sin(t*.83+b.ph*2)*44;
    b.el.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+") rotate("+(Math.cos(t*b.sp+b.ph)*14).toFixed(1)+")");
  }
  if(!reduce)wind.textContent=(2.4+1.4*Math.sin(t*.35)).toFixed(1);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
