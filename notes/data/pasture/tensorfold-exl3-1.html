<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Willowbrook Pasture</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#7ec3e8}
#scene{display:block;width:100vw;height:100vh}
text{font-family:Georgia,"Palatino Linotype","Book Antiqua","Times New Roman",serif}

/* ---------- ambient loops ---------- */
#rays{animation:spin 54s linear infinite;transform-origin:1296px 168px}
#glow{animation:breathe 7s ease-in-out infinite;transform-origin:1296px 168px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.07)}}
.tree{animation:sway 6.6s ease-in-out infinite;transform-origin:0 0}
.sway{animation:wind 3.6s ease-in-out infinite;transform-origin:0 0}
.wing{animation:flapw .19s ease-in-out infinite;transform-origin:0 0}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.9deg)}}
@keyframes wind{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5.5deg)}}
@keyframes flapw{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.28)}}
@keyframes flapv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.28)}}
.tail{animation:swish 2.7s ease-in-out infinite}
.mane{animation:swish 3.4s ease-in-out infinite;transform-origin:30px -166px}
@keyframes swish{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}

/* ---------- animals ---------- */
.animal{cursor:pointer}
.hop{animation:hop var(--t) cubic-bezier(.35,.05,.55,.95) infinite;animation-delay:var(--d);transform-origin:0 0;will-change:transform}
.shd{animation:shd var(--t) cubic-bezier(.35,.05,.55,.95) infinite;animation-delay:var(--d);transform-origin:0 4px}
@keyframes hop{
 0%{transform:translateY(0) scale(1,1)}
 10%{transform:translateY(4px) scale(1.05,.93)}
 28%{transform:translateY(calc(var(--a)*-1)) scale(.96,1.07)}
 46%{transform:translateY(calc(var(--a)*-1)) scale(1,1)}
 66%{transform:translateY(calc(var(--a)*-.2)) scale(1.01,1)}
 82%{transform:translateY(2px) scale(1.04,.95)}
 100%{transform:translateY(0) scale(1,1)}}
@keyframes big{
 0%{transform:translateY(0) scale(1,1)}
 12%{transform:translateY(6px) scale(1.09,.9)}
 40%{transform:translateY(calc(var(--a)*-2.2)) scale(.94,1.1)}
 58%{transform:translateY(calc(var(--a)*-2.1)) rotate(2deg)}
 82%{transform:translateY(3px) scale(1.07,.93)}
 100%{transform:translateY(0) scale(1,1)}}
@keyframes shd{0%{opacity:.3;transform:scaleX(1)}10%{opacity:.36;transform:scaleX(1.05)}
 30%{opacity:.15;transform:scaleX(.84)}46%{opacity:.14;transform:scaleX(.82)}70%{opacity:.28;transform:scaleX(1)}}
.animal.bolt .hop{animation-name:big;animation-duration:.62s}
.fig{transition:transform .32s cubic-bezier(.2,.8,.2,1);transform-origin:0 0}
.animal:hover .fig,.animal.peek .fig{transform:translateY(-4px) scale(1.02)}
.animal:hover,.animal.peek{z-index:2}
.tag{opacity:0;transform:translateY(9px);transition:opacity .28s ease,transform .34s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.animal:hover .tag,.animal.peek .tag{opacity:1;transform:translateY(0)}

/* ---------- chrome ---------- */
#hud{position:fixed;top:26px;left:32px;pointer-events:none}
#hud .kick{display:flex;align-items:center;gap:9px;margin-bottom:12px;font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#0d3a22;opacity:.8}
.dot{width:8px;height:8px;border-radius:50%;background:#e0533f;animation:ping 2.1s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,83,63,.55)}70%{box-shadow:0 0 0 13px rgba(224,83,63,0)}100%{box-shadow:0 0 0 0 rgba(224,83,63,0)}}
#hud h1{margin:0;font:400 56px/.84 Georgia,"Times New Roman",serif;letter-spacing:-1.2px;color:#fffdf3;text-shadow:0 4px 22px rgba(16,58,38,.4)}
#hud h1 span{display:block;margin-top:15px;font:700 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.46em;text-transform:uppercase;color:#0f3d25;opacity:.7;text-shadow:none}
#hud .meta{margin:17px 0 0;max-width:340px;font:400 12.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0d3320;opacity:.66}
#legend{position:fixed;left:32px;bottom:28px;display:flex;gap:9px;flex-wrap:wrap;max-width:62vw}
#legend button{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 10px;border:0;border-left:4px solid #6fae4e;border-radius:4px 8px 8px 4px;background:#fff8e9;color:#173a24;font:700 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(14,52,32,.22);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .22s}
#legend button:hover{transform:translateY(-4px);background:#fffdf6;box-shadow:0 12px 26px rgba(14,52,32,.3)}
#legend i{width:9px;height:9px;border-radius:50%;display:block}
#sig{position:fixed;right:26px;bottom:24px;margin:0;font:600 10px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.9);text-shadow:0 2px 8px rgba(20,60,40,.5);pointer-events:none}
@media (max-width:700px){#hud h1{font-size:34px}#hud .meta{display:none}}
</style>
</head>

<p id="sig">Pure SVG primitives &#183; no images &#183; no fonts &#183; no network</p>

<script>
(function(){
 var rnd=function(a,b){return a+Math.random()*(b-a)},
     fence=document.getElementById('fence'),tufts=document.getElementById('tufts'),
     hills=document.getElementById('hills'),tl=document.getElementById('treeline'),
     clouds=document.getElementById('clouds'),flock=document.getElementById('flock'),
     flies=document.getElementById('flies'),s='',i,x;

 /* ---- far fence ---- */
 for(i=0;i<14;i++){x=i*125;
  s+='<rect x="'+x+'" y="586" width="12" height="86" rx="3" fill="#8b6440"/><rect x="'+(x+7)+'" y="586" width="5" height="86" rx="2" fill="#6a492d" opacity=".55"/>';}
 s+='<rect x="-20" y="600" width="1640" height="10" rx="5" fill="#9e7449"/><rect x="-20" y="600" width="1640" height="3" fill="#c39a6e" opacity=".6"/><rect x="-20" y="621" width="1640" height="8" rx="4" fill="#8b6440"/>';
 fence.innerHTML=s;

 /* ---- grass tufts + flowers ---- */
 s='';
 for(i=0;i<68;i++){
  var y=rnd(596,892),k=(y-585)/315;
  s+='<g transform="translate('+rnd(-20,1620).toFixed(0)+','+y.toFixed(0)+') scale('+(.55+k*.95).toFixed(2)+')">'
    +'<path class="sway" style="animation-delay:'+rnd(-2.8,-.3).toFixed(2)+'s;animation-duration:'+rnd(2.8,5.2).toFixed(2)+'s" '
    +'d="M0,0q-4,-10-11,-15M0,0q-1,-13 2,-20M0,0q6,-9 12,-13" fill="none" stroke="rgb('
    +(70-k*22|0)+','+(152-k*38|0)+','+(58-k*16|0)+')" stroke-width="3.2" stroke-linecap="round"/></g>';
 }
 for(i=0;i<22;i++){
  var y2=rnd(622,884),k2=(y2-585)/315,r=(2.1+k2*2.6).toFixed(1),
      col=['#fff6e2','#ffd9e8','#fff2a8','#ffc0d2'][i%4];
  s+='<g transform="translate('+rnd(10,1590).toFixed(0)+','+y2.toFixed(0)+')"><g class="sway" style="animation-delay:'+rnd(-3,-.4).toFixed(2)+'s;animation-duration:'+rnd(3,5.4).toFixed(2)+'s">'
    +'<path d="M0,0q-2,-8 0,-13" stroke="#4b8c3d" stroke-width="2.4" fill="none"/>'
    +'<circle cx="0" cy="-15" r="'+r+'" fill="'+col+'"/><circle cx="0" cy="-15" r="'+(r*.34).toFixed(1)+'" fill="#efb529"/></g></g>';
 }
 tufts.innerHTML=s;

 /* ---- drifting clouds ---- */
 var cl=[].map.call(document.querySelectorAll('.cl'),function(el){
  return{e:el,x:+el.getAttribute('data-x'),y:+el.getAttribute('data-y'),s:+el.getAttribute('data-s'),v:+el.getAttribute('data-v')};});

 /* ---- birds ---- */
 var bs=[].map.call(document.querySelectorAll('.bird'),function(el){
  el.innerHTML='<path class="wing" style="animation-name:flapv;animation-duration:'+rnd(.34,.62).toFixed(2)+'s" d="M-11,0c3.5,-7 7.5,-7 11,-1 3.5,-6 7.5,-6 11,1" stroke-width="2.6"/>';
  return{e:el,x:+el.getAttribute('data-x'),y:+el.getAttribute('data-y'),s:+el.getAttribute('data-s'),v:+el.getAttribute('data-v'),p:rnd(0,6)};});

 /* ---- butterflies ---- */
 var fl=[].map.call(document.querySelectorAll('.bf'),function(el){
  var w='<path d="M0,0c-9,-11-21,-8-18,2 2,7 11,8 18,-2z" fill="#f0a63a"/><path d="M0,0c-8,5-14,11-9,15 5,3 10,-6 9,-15z" fill="#dd8b27"/>';
  el.innerHTML='<g class="wing" style="animation-duration:'+rnd(.15,.24).toFixed(2)+'s">'+w+'</g>'
   +'<g transform="scale(-1,1)"><g class="wing" style="animation-duration:'+rnd(.15,.24).toFixed(2)+'s">'+w+'</g></g>'
   +'<rect x="-1" y="-4" width="2" height="14" rx="1" fill="#3a2b1c"/>';
  return{e:el,p:rnd(0,6),cx:+el.getAttribute('data-cx'),cy:+el.getAttribute('data-cy'),rx:+el.getAttribute('data-rx'),ry:+el.getAttribute('data-ry')};});

 /* ---- pointer parallax ---- */
 var mx=0,my=0,px=0,py=0;
 addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});

 var last=performance.now();
 function frame(now){
  var dt=Math.min(.05,(now-last)/1000),t=now/1000;last=now;
  px+=(mx*16-px)*.05;py+=(my*9-py)*.05;
  clouds.setAttribute('transform','translate('+(-px*1.3).toFixed(2)+','+(-py*.6).toFixed(2)+')');
  hills.setAttribute('transform','translate('+(-px*.45).toFixed(2)+','+(-py*.25).toFixed(2)+')');
  tl.setAttribute('transform','translate('+(-px*.65).toFixed(2)+',0)');
  for(var i=0;i<cl.length;i++){var c=cl[i];c.x+=c.v*dt;if(c.x>1820)c.x=-420;if(c.x<-440)c.x=1800;
   c.e.setAttribute('transform','translate('+c.x.toFixed(1)+','+(c.y+Math.sin(t*.32+c.x*.01)*6).toFixed(1)+') scale('+c.s+')');}
  for(i=0;i<bs.length;i++){var b=bs[i];b.x+=b.v*dt;if(b.x>1760){b.x=rnd(-260,-60);b.y=rnd(92,220);}
   b.e.setAttribute('transform','translate('+b.x.toFixed(1)+','+(b.y+Math.sin(t*1.6+b.p)*9).toFixed(1)+') scale('+b.s+')');}
  flock.setAttribute('transform','translate('+(px*.8).toFixed(2)+','+(py*.5).toFixed(2)+')');
  for(i=0;i<fl.length;i++){var g=fl[i],a=t*.75+g.p;
   g.e.setAttribute('transform','translate('+(g.cx+Math.sin(a)*g.rx).toFixed(1)+','+(g.cy+Math.sin(a*1.9)*g.ry).toFixed(1)+') rotate('+(Math.cos(a)*15).toFixed(1)+')');}
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);

 /* ---- playful animals ---- */
 [].forEach.call(document.querySelectorAll('.animal'),function(a){
  a.addEventListener('click',function(){
   a.classList.add('bolt');
   clearTimeout(a._t);a._t=setTimeout(function(){a.classList.remove('bolt')},720);});});
 [].forEach.call(document.querySelectorAll('#legend button'),function(btn){
  var a=document.getElementById(btn.getAttribute('data-a'));
  btn.addEventListener('mouseenter',function(){a.classList.add('peek')});
  btn.addEventListener('mouseleave',function(){a.classList.remove('peek')});
  btn.addEventListener('click',function(){a.classList.add('bolt');clearTimeout(a._t);a._t=setTimeout(function(){a.classList.remove('bolt')},720)});});
})();
</script>
