# Promotion 2026-09-24 (finding 234): the drafter's 32k draft-vocab slice as NVFP4 (45 MiB) instead of BF16 (160 MiB),
# read by a Triton W4A16 kernel. c=1 decode -3.4 %, c=4 +2.8 %, acceptance unchanged, c=1 output identical (3 starts/arm).
# Needs the FNNVFP4 patch in the venv (/opt/llm/runners/nvfp4head/fnnvfp4_patch.py on); inert without these lines.
# REVERT: rm this file; systemctl daemon-reload; systemctl restart vllm-flashnext
#         (optionally also: /opt/llm/runtime/vllm-venv-main1ea7/bin/python /opt/llm/runners/nvfp4head/fnnvfp4_patch.py off)
[Service]
Environment=FN_DRAFT_HEAD_NVFP4=1
Environment=FN_NVFP4_CFG=64,4
