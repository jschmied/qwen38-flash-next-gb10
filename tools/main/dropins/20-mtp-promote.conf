# Promotion 2026-09-22: MTP n=3 with the NVFP4 drafter + 32k draft-vocab slice.
# Decided on agentloop2 s/turn in the prod shape (results/prodpromo.txt), NOT on
# single-shot tok/s -- single-shot is blind to the prefix-block cost of speculation.
# Same target body as fp8head (157 FP8_PB_WO + NVFP4 set); only the drafter differs,
# and the target verifies every draft, so this is a speed change, not a quality trade.
# Revert = delete this file + systemctl daemon-reload + restart.
[Service]
Environment=FN_MODEL=/opt/llm/models/qwen38-flash-next-mtpfp4
Environment=FN_SPEC_METHOD=mtp
Environment=FN_SPEC_N=3
Environment=FN_SPEC_NODROP=1
Environment=FN_SPEC_LOCALARGMAX=1
Environment=FN_DRAFT_VOCAB=/opt/llm/runners/dv/draft_vocab_32768.txt
